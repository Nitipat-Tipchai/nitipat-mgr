  <!-- API Proxy for GAS -->
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwrHhlu-hEvp6IHS-1RXC4wRBXuNV54nRXa-jh-cibzAhqCTIvTEG5BGb0C_vghip-t/exec"; 

    window.google = {
      script: {
        run: new Proxy({}, {
          get: function (target, prop) {
            if (['withSuccessHandler', 'withFailureHandler'].includes(prop)) {
              return function (handler) {
                const context = { success: null, failure: null };
                context[prop === 'withSuccessHandler' ? 'success' : 'failure'] = handler;
                return createChain(context);
              };
            }
            return function (...args) {
              executeRpc(prop, args, { success: null, failure: null });
            };
          }
        })
      }
    };

    function createChain(context) {
      return new Proxy({}, {
        get: function (target, prop) {
          if (['withSuccessHandler', 'withFailureHandler'].includes(prop)) {
            return function (handler) {
              context[prop === 'withSuccessHandler' ? 'success' : 'failure'] = handler;
              return createChain(context);
            };
          }
          return function (...args) {
            executeRpc(prop, args, context);
          };
        }
      });
    }

    function executeRpc(method, args, context) {
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: method, args: args }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            if (context.success) context.success(data.result);
          } else {
            if (context.failure) context.failure(data.error);
            else console.error("GAS Error:", data.error);
          }
        })
        .catch(err => {
          if (context.failure) context.failure(err.toString());
          else console.error("Network Error:", err);
        });
    }
  </script>

  <!-- Extracted Styles and Scripts -->
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
