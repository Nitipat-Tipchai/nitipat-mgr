<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitipat MGR - Secure Document Vault</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020617;
      --card-bg: rgba(15, 23, 42, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; 
      font-family: 'Kanit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(147, 51, 234, 0.15), transparent 25%);
    }
    
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
      width: 100%; max-width: 950px;
      opacity: 0; transform: translateY(30px) scale(0.98);
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes slideUpFade { 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    .header-panel {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 30px; padding-bottom: 25px; 
      border-bottom: 1px solid var(--border);
    }

    .profile-info {
      display: flex; align-items: center; gap: 20px;
    }
    
    .avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.8rem; color: white;
      box-shadow: 0 10px 25px var(--accent-glow);
      position: relative;
    }
    
    .avatar::after {
      content: '✔'; position: absolute; bottom: -2px; right: -2px;
      background: #10b981; color: white; font-size: 0.6rem;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--bg);
    }

    .user-details h2 { 
      margin: 0 0 6px 0; font-size: 1.4rem; font-weight: 700; 
      display: flex; align-items: center; gap: 10px; 
    }
    
    .verified-badge {
      background: rgba(16, 185, 129, 0.15); color: #10b981;
      font-size: 0.65rem; padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3); font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    .user-details p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
    
    .vault-tag {
      text-align: right;
    }
    .vault-tag .title { font-weight: 700; color: #60a5fa; font-size: 0.9rem; letter-spacing: 1px; }
    .vault-tag .subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

    .doc-meta {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 20px;
    }
    .doc-meta h3 { margin: 0 0 8px 0; font-size: 1.25rem; font-weight: 600; display:flex; align-items:center; gap:8px;}
    .doc-meta .details { font-size: 0.85rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .doc-viewer {
      width: 100%; height: 550px;
      background: rgba(0,0,0,0.4);
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 5px 20px rgba(0,0,0,0.5);
      position: relative;
    }
    
    .doc-viewer iframe, .doc-viewer embed { width: 100%; height: 100%; border: none; }
    .doc-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .action-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 30px; padding-top: 25px; border-top: 1px solid var(--border);
    }
    
    .warning-text {
      font-size: 0.8rem; color: #fbbf24; display: flex; align-items: center; gap: 8px;
      background: rgba(251, 191, 36, 0.1); padding: 10px 16px; border-radius: 12px;
    }

    .btn {
      padding: 14px 28px; border-radius: 14px; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: none; outline: none;
      font-family: inherit; display: inline-flex; align-items: center; gap: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5); color: white;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    
    .btn-primary:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.6), inset 0 1px 0 rgba(255,255,255,0.3); 
      filter: brightness(1.1); 
    }

    .password-screen { text-align: center; max-width: 450px; margin: 0 auto; padding: 50px 30px; }
    .password-icon { font-size: 4rem; margin-bottom: 20px; animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(0.95); } }
    
    .password-input {
      width: 100%; padding: 16px; border-radius: 14px; background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15); color: white; font-size: 1.1rem;
      margin-bottom: 25px; text-align: center; letter-spacing: 4px; outline: none;
      transition: all 0.2s ease;
    }
    .password-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); background: rgba(0,0,0,0.5); }

    .spinner-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .spinner {
      width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.05);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite; margin-bottom: 25px;
    }

    @media (max-width: 768px) {
      .glass-card { padding: 25px; border-radius: 20px; }
      .header-panel { flex-direction: column; gap: 20px; }
      .vault-tag { text-align: left; }
      .action-bar { flex-direction: column; gap: 20px; align-items: stretch; }
      .warning-text { justify-content: center; text-align: center; }
      .btn { justify-content: center; }
      .doc-viewer { height: 400px; }
    }
  </style>
</head>
<body>

  <div id="app" style="width: 100%; display: flex; justify-content: center;">
    <div class="spinner-container">
      <div class="spinner"></div>
      <div style="font-weight: 600; color: var(--text-muted); letter-spacing: 1px;">กำลังเชื่อมต่อกับระบบคลังเอกสาร...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Public Firebase Config for fetching the public shared files
    const firebaseConfig = {
      apiKey: "AIzaSyB7pGaPWn4n7NxrQ9l60V16u-qj05khqU8",
      authDomain: "mat-e-db476.firebaseapp.com",
      projectId: "mat-e-db476",
      storageBucket: "mat-e-db476.firebasestorage.app",
      messagingSenderId: "986910230630",
      appId: "1:986910230630:web:7b4b23ce828d18ab7bc5a7"
    };

    let app;
    let db;
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) {
      console.error("Firebase Init Error:", e);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('doc');
    let sharedItem = null;
    let unlocked = false;

    async function init() {
      if (!slug) {
        showError("ไม่พบรหัสเอกสาร", "ลิงก์นี้ไม่สมบูรณ์ หรือพารามิเตอร์ของเอกสารถูกเปลี่ยนแปลง");
        return;
      }

      if (!db) {
        showError("ระบบขัดข้อง", "ไม่สามารถเริ่มการทำงานของฐานข้อมูลได้");
        return;
      }

      try {
        const snap = await getDoc(doc(db, "ilm_data", "files"));
        if (snap.exists()) {
          const files = snap.data().list || [];
          // Support both exact match and suffix match in case the user accidentally kept 'nitipat/'
          sharedItem = files.find(f => f.slug === slug || (f.slug && slug.endsWith(f.slug))); 
        }

        if (!sharedItem) {
          showError("ไม่พบเอกสารในคลัง", "เอกสารนี้อาจถูกลบ ถูกเพิกถอนสิทธิ์ หรือไม่มีอยู่จริงในระบบคลังเอกสาร");
          return;
        }

        render();

      } catch (e) {
        showError("เกิดข้อผิดพลาดในการเชื่อมต่อ", "ไม่สามารถดึงข้อมูลจากฐานข้อมูลคลาวด์ได้ กรุณาลองใหม่อีกครั้ง");
        console.error(e);
      }
    }

    function render() {
      const appDiv = document.getElementById('app');
      
      // Password Protection Gate
      if (sharedItem.password && !unlocked) {
        appDiv.innerHTML = `
          <div class="glass-card password-screen">
            <div class="password-icon">🔐</div>
            <h3 style="margin: 0 0 12px 0; font-size: 1.5rem; font-weight: 700;">เอกสารมีการเข้ารหัสป้องกัน</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px; line-height:1.6;">
              เอกสาร <strong>${escapeHTML(sharedItem.name)}</strong> ได้รับการปกป้องความเป็นส่วนตัว กรุณากรอกรหัสผ่านเพื่อเข้าถึงเนื้อหา
            </p>
            <input type="password" class="password-input" id="pass-input" placeholder="ป้อนรหัสผ่านที่ได้รับ..." autocomplete="off">
            <button class="btn btn-primary" style="width: 100%; justify-content:center;" id="btn-unlock">🔓 ปลดล็อกเอกสาร</button>
            <div id="pass-err" style="color: #ef4444; font-size: 0.9rem; margin-top: 20px; font-weight:600; display: none; background:rgba(239,68,68,0.1); padding:10px; border-radius:10px;">❌ รหัสผ่านไม่ถูกต้อง!</div>
          </div>
        `;
        
        const btn = document.getElementById('btn-unlock');
        const input = document.getElementById('pass-input');
        
        btn.addEventListener('click', checkPassword);
        input.addEventListener('keypress', (e) => { if(e.key === 'Enter') checkPassword(); });
        
        input.focus();
        return;
      }

      // Viewer Rendering
      const isPdf = sharedItem.name.toLowerCase().endsWith('.pdf') || sharedItem.mimeType === 'application/pdf';
      const isImage = sharedItem.name.toLowerCase().endsWith('.png') || sharedItem.name.toLowerCase().endsWith('.jpg') || (sharedItem.mimeType && sharedItem.mimeType.startsWith('image/'));
      
      let viewerHtml = `<div style="padding: 50px; text-align: center; color: var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:15px;">
        <span style="font-size:3rem;">📦</span>
        <span>ไม่มีตัวอย่างการแสดงผลสำหรับไฟล์ประเภทนี้<br>กรุณากดดาวน์โหลดเพื่อเปิดไฟล์</span>
      </div>`;
      
      if (isImage) {
        const src = sharedItem.driveFileId ? `https://drive.google.com/uc?id=${sharedItem.driveFileId}` : sharedItem.data;
        if (src) viewerHtml = `<img src="${src}" alt="Document Preview" />`;
      } else if (isPdf) {
        const src = sharedItem.driveFileId ? `https://drive.google.com/file/d/${sharedItem.driveFileId}/preview` : `${sharedItem.data}#toolbar=0&navpanes=0&scrollbar=0`;
        if (sharedItem.driveFileId || sharedItem.data) viewerHtml = `<iframe src="${src}" type="application/pdf"></iframe>`;
      }

      const sizeDisplay = sharedItem.size ? `${sharedItem.size}` : 'Unknown Size';
      const dateDisplay = sharedItem.createdAt ? new Date(sharedItem.createdAt).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }) : 'Unknown Date';

      appDiv.innerHTML = `
        <div class="glass-card">
          <div class="header-panel">
            <div class="profile-info">
              <div class="avatar">N</div>
              <div class="user-details">
                <h2>นายนิติพัฒน์ ทิพย์ชัย <span class="verified-badge">✔ Verified</span></h2>
                <p>Materials Engineering, Kasetsart University</p>
                <p style="font-size:0.75rem; margin-top:4px; opacity:0.8; font-family:'JetBrains Mono', monospace;">ID: 20067105527480</p>
              </div>
            </div>
            <div class="vault-tag">
              <div class="title">🔐 SECURE VAULT</div>
              <div class="subtitle">Read-only Shared Access</div>
            </div>
          </div>
          
          <div class="doc-meta">
            <div>
              <h3>📄 ${escapeHTML(sharedItem.name)}</h3>
              <div class="details">SIZE: ${sizeDisplay} &nbsp;|&nbsp; UPLOADED: ${dateDisplay}</div>
            </div>
          </div>

          <div class="doc-viewer">
            ${viewerHtml}
          </div>

          <div class="action-bar">
            <div class="warning-text">
              <span>⚠️</span> เอกสารนี้สงวนลิขสิทธิ์ ใช้สำหรับติดต่อเรื่องงานหรือฝึกงานเท่านั้น
            </div>
            <button class="btn btn-primary" id="btn-download">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              ดาวน์โหลดไฟล์ต้นฉบับ
            </button>
          </div>
        </div>
      `;

      // Download Action
      document.getElementById('btn-download').addEventListener('click', () => {
        let downloadUrl = sharedItem.data || '#';
        if (sharedItem.driveFileId) {
          downloadUrl = `https://drive.google.com/uc?id=${sharedItem.driveFileId}&export=download`;
        }
        
        const a = document.createElement('a');
        a.href = downloadUrl;
        // For data URLs, adding download attribute works best. For Drive URLs, it opens or prompts.
        a.download = sharedItem.name || 'document';
        // Open in new tab for Drive URLs just in case
        if (sharedItem.driveFileId) a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });
    }

    function checkPassword() {
      const input = document.getElementById('pass-input').value;
      if (input === sharedItem.password) {
        unlocked = true;
        render();
      } else {
        const err = document.getElementById('pass-err');
        err.style.display = 'block';
        document.getElementById('pass-input').value = '';
        document.getElementById('pass-input').focus();
      }
    }

    function showError(title, msg) {
      document.getElementById('app').innerHTML = `
        <div class="glass-card" style="text-align: center; max-width: 500px; padding: 50px 30px;">
          <div style="font-size: 5rem; margin-bottom: 20px;">🔍</div>
          <h3 style="margin: 0 0 15px 0; color: #f87171; font-size:1.6rem; font-weight:700;">${escapeHTML(title)}</h3>
          <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 0; line-height:1.6;">${escapeHTML(msg)}</p>
        </div>
      `;
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>'"]/g, 
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
      );
    }

    // Initialize App
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
